<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BambuLab Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load Socket.IO -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <h1>BambuLab P2S</h1>
            <div class="status-badge" id="printer-status">Connecting...</div>
        </div>

        <!-- Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Nozzle</h3>
                <div class="value"><span id="nozzle-temp">--</span><span class="unit">°C</span></div>
            </div>
            <div class="metric-card">
                <h3>Bed</h3>
                <div class="value"><span id="bed-temp">--</span><span class="unit">°C</span></div>
            </div>
            <div class="metric-card">
                <h3>Chamber</h3>
                <div class="value"><span id="chamber-temp">--</span><span class="unit">°C</span></div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <div class="progress-header">
                <span>Print Progress</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" onclick="toggleLight('on')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path><circle cx="12" cy="12" r="4"></circle></svg>
                Light ON
            </button>
            <button class="btn btn-primary" onclick="toggleLight('off')" style="background: rgba(255, 255, 255, 0.05);">
                Light OFF
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
